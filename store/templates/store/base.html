{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сайт{% endblock %}</title>
    <meta name="theme-color" content="#0a1020">
    <link rel="icon" type="image/x-icon" href="{% static 'store/favicon/favicon.ico' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'store/favicon/favicon-16x16.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'store/favicon/favicon-32x32.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'store/favicon/apple-touch-icon.png' %}">
    <link rel="manifest" href="{% static 'store/favicon/site.webmanifest' %}">
    <link rel="stylesheet" href="{% static 'store/css/styles.css' %}">
</head>
<body>
    <div class="page-intro-splash" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="site-nav">
            <a href="{% url 'store:home' %}">Главная</a>
            <a href="{% url 'store:catalog' %}">Каталог</a>
        </nav>
    </header>

    <main class="page-wrap">
        {% block content %}{% endblock %}
    </main>
</body>
</html>

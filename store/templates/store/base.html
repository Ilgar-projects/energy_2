{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сайт{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'store/css/styles.css' %}">
</head>
<body>
    <div class="page-intro-splash" aria-hidden="true"></div>

    <header class="site-header">
        <nav class="site-nav">
            <a href="{% url 'store:home' %}">Главная</a>
            <a href="{% url 'store:catalog' %}">Каталог</a>
        </nav>
    </header>

    <main class="page-wrap">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
